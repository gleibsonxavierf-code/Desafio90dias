<style>

<header><h1>Projeto Reconstrução 90D</h1><small id="sub"></small></header>
<main id="app"></main>
<nav id="nav"></nav><div id="toast"></div>
<script>
"use strict";
var K="rec90d.v1",$=function(s){return document.querySelector(s)};
var uid=function(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3)};
var today=function(){var d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
var addD=function(d,n){var x=new Date(d+"T12:00:00Z");x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10)};
var diffD=function(a,b){return Math.round((new Date(b+"T12:00:00Z")-new Date(a+"T12:00:00Z"))/864e5)};
var brd=function(d){return d?d.split("-").reverse().join("/"):""};
var lab=function(d){return d.slice(8)+"/"+d.slice(5,7)};
var num=function(v){var n=parseFloat(String(v==null?"":v).replace(",","."));return isFinite(n)?n:0};
var fmt=function(v){return "R$ "+num(v).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2})};
var f1=function(v){return (Math.round(v*10)/10).toLocaleString("pt-BR")};
var esc=function(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})};
var sum=function(a,f){return a.reduce(function(s,x){return s+num(f(x))},0)};
var avg=function(a){return a.length?a.reduce(function(s,x){return s+x},0)/a.length:0};
var COLS=["fin","sau","neg","dis","fam","met","rev"];
function def(){var t=today(),T=function(n){return {id:uid(),n:n,c:"0000-00-00",a:""}};
 return {v:1,g:{start:t,dias:90,peso0:100,pesoMeta:0,reserva:10000,anual:1000000,grupos:1,op:false,telaBase:"3 a 5 h/dia"},
 tasks:["Beber 3 litros de água","Treino do dia","Alimentação dentro do plano","Dormir 7 horas ou mais","Redes sociais abaixo de 2 h","Ler 20 minutos","Oração ou reflexão","Tempo de qualidade com a família","Trabalhar no grupo de ofertas","Registrar finanças do dia"].map(T),
 chk:{},notes:{},trn:[],mig:{},fin:[],sau:[],neg:[],dis:[],fam:[],met:[],rev:[],ui:{}}}
var S,E={},ok=true;
function load(){try{var r=localStorage.getItem(K);S=r?JSON.parse(r):def()}catch(e){S=def();ok=false}
 var d=def();for(var k in d)if(S[k]==null)S[k]=d[k];for(var k2 in d.g)if(S.g[k2]==null)S.g[k2]=d.g[k2];migrate(S)}
function save(){try{S.u=Date.now();localStorage.setItem(K,JSON.stringify(S));schedPush();return true}catch(e){toast("Não foi possível salvar neste navegador. Faça um backup agora.");return false}}
function toast(m){var t=$("#toast");t.textContent=m;t.className="on";clearTimeout(toast.h);toast.h=setTimeout(function(){t.className=""},2600)}
/* ---------- módulos genéricos ---------- */
var U={Peso:" kg",Cintura:" cm",Braço:" cm",Treino:" min"};
var MODS={
fin:{t:"Finanças",req:["v"],f:[["d","Data","date"],["k","Tipo","sel",["Receita","Despesa","Parcela","Cartão","Reserva"]],["n","Descrição","text"],["v","Valor (R$)","num"]],line:function(r){return [r.n||r.k,brd(r.d)+" · "+r.k,(r.k=="Receita"||r.k=="Reserva"?"+ ":"− ")+fmt(r.v)]}},
sau:{t:"Saúde",req:["v|n"],f:[["d","Data","date"],["k","Tipo","sel",["Peso","Cintura","Braço","Treino","Alimentação"]],["v","Valor (kg, cm ou minutos)","num"],["n","Nota (treino feito, refeições…)","text"]],line:function(r){return [r.k+(r.v!==""&&r.v!=null?" · "+f1(r.v)+(U[r.k]||""):""),brd(r.d)+(r.n?" · "+r.n:""),""]}},
neg:{t:"Negócio digital",req:["n"],f:[["d","Data","date"],["n","Grupo ou oferta","text"],["p","Participantes no grupo","num"],["s","Vendas (R$)","num"],["c","Comissão (R$)","num"],["cv","Conversões (nº de compras)","num"]],line:function(r){return [r.n,brd(r.d)+" · "+f1(r.p)+" part. · "+f1(r.cv)+" conv. · vendas "+fmt(r.s),fmt(r.c)]}},
dis:{t:"Disciplina",req:["t|s|l|h"],f:[["d","Data","date"],["t","Tempo de tela (horas)","num"],["s","Sono (horas)","num"],["l","Leitura (minutos)","num"],["h","Hábito ou observação","text"]],line:function(r){return ["Tela "+f1(r.t)+" h · Sono "+f1(r.s)+" h",brd(r.d)+" · leitura "+f1(r.l)+" min"+(r.h?" · "+r.h:""),""]}},
fam:{t:"Família e espiritualidade",req:["n"],f:[["d","Data","date"],["k","Área","sel",["Família","Espiritualidade"]],["tp","Tipo","sel",["Objetivo","Registro"]],["n","Texto","area"]],line:function(r){return [r.n,brd(r.d)+" · "+r.k+" · "+r.tp,""]}},
met:{t:"Metas",req:["n","a"],f:[["p","Período","sel",["Diária","Semanal","Mensal"]],["n","Meta","text"],["a","Valor alvo","num"],["c","Valor atual","num"]],line:function(r){var p=r.a>0?Math.min(100,Math.round(r.c/r.a*100)):0;return [r.n,r.p+" · "+f1(r.c)+" de "+f1(r.a)+(r.h&&r.h.length?" · alterada "+r.h.length+"×":""),p+"%"]}},
rev:{t:"Revisão semanal",req:["a|b|c"],f:[["d","Semana de (data)","date"],["a","O que funcionou?","area"],["b","O que preciso melhorar?","area"],["c","Foco da próxima semana","area"]],line:function(r){return ["Semana de "+brd(r.d),(r.a||r.b||r.c||"").slice(0,70),""]}}
};
function formHTML(k){var m=MODS[k],e=S[k].filter(function(r){return r.id==E[k]})[0]||{};
 return '<form class="card" data-f="'+k+'"><h3>'+(e.id?"Editar registro":"Novo registro")+"</h3>"+m.f.map(function(x){var n=x[0],t=x[2],o=x[3],v=e[n]!=null?e[n]:(t=="date"?today():""),i;
  if(t=="sel")i="<select name="+n+">"+o.map(function(y){return "<option"+(y==v?" selected":"")+">"+y+"</option>"}).join("")+"</select>";
  else if(t=="area")i='<textarea name="'+n+'" rows="3">'+esc(v)+"</textarea>";
  else i='<input name="'+n+'" type="'+(t=="date"?"date":"text")+'"'+(t=="num"?' inputmode="decimal"':"")+' value="'+esc(v)+'" autocomplete="off">';
  return "<label>"+x[1]+i+"</label>"}).join("")+'<div class="row"><button class="pri">'+(e.id?"Salvar alterações":"Adicionar")+"</button>"+(e.id?'<button type="button" data-c="'+k+'">Cancelar</button>':"")+"</div></form>"}
function listHTML(k,max){var m=MODS[k],rows=S[k].slice().sort(function(a,b){return (b.d||"").localeCompare(a.d||"")}).slice(0,max||60);
 return '<div class="card"><h3>Registros</h3>'+(rows.length?rows.map(function(r){var l=m.line(r);return '<div class="it"><div class="ib"><b>'+esc(l[0])+"</b><small>"+esc(l[1])+'</small></div><div class="iv">'+esc(l[2])+'</div><button data-e="'+k+":"+r.id+'" aria-label="Editar">✎</button><button data-x="'+k+":"+r.id+'" aria-label="Excluir">🗑</button></div>'}).join(""):'<p class="m">Nenhum registro ainda.</p>')+"</div>"}
function submitRec(k,o){var m=MODS[k],rec={},bad=false;
 m.f.forEach(function(x){var v=o[x[0]];rec[x[0]]=x[2]=="num"?(String(v==null?"":v).trim()===""?"":num(v)):String(v==null?"":v).trim()});
 m.req.forEach(function(q){if(!q.split("|").some(function(n){return rec[n]!==""&&rec[n]!=null}))bad=true});
 if(bad){toast("Preencha os campos principais.");return false}
 var i=S[k].findIndex(function(r){return r.id==E[k]});
 if(i>=0){var old=S[k][i],h=(old.h||[]).concat([Object.assign({at:today()},old,{h:undefined})]);rec.id=old.id;rec.h=h;S[k][i]=rec}
 else{rec.id=uid();S[k].push(rec)}
 E[k]=null;save();toast("Salvo");return true}
/* ---------- cálculos ---------- */
var applies=function(t,d){return t.c<=d&&(!t.a||d<t.a)};
function dayTasks(d){return S.tasks.filter(function(t){return applies(t,d)})}
function pct(d){var ts=dayTasks(d);if(!ts.length)return null;var c=S.chk[d]||[];return Math.round(ts.filter(function(t){return c.indexOf(t.id)>=0}).length/ts.length*100)}
function lastDays(n){var a=[],t=today();for(var i=n-1;i>=0;i--)a.push(addD(t,-i));return a}
function pcts(ds){return ds.map(pct).filter(function(x){return x!=null})}
function dayN(){return Math.max(1,diffD(S.g.start,today())+1)}
function inRange(r,a,b){return r.d>=a&&r.d<=b}
function fin(a,b){var R=S.fin.filter(function(r){return inRange(r,a,b)});var g=function(ks){return sum(R.filter(function(r){return ks.indexOf(r.k)>=0}),function(r){return r.v})};
 return {rec:g(["Receita"]),des:g(["Despesa","Parcela","Cartão"]),par:g(["Parcela"]),res:g(["Reserva"])}}
function pesos(){return S.sau.filter(function(r){return r.k=="Peso"&&r.v!==""}).sort(function(a,b){return a.d.localeCompare(b.d)})}
/* ---------- gráficos ---------- */
function chart(pts,type,cls){if(!pts.length)return '<p class="m">Sem dados ainda.</p>';
 var W=300,H=110,P=14,vs=pts.map(function(p){return p.v}),mx=Math.max.apply(null,vs.concat([0.0001])),mn=type=="l"?Math.min.apply(null,vs):0,rg=(mx-mn)||1,n=pts.length,bw=(W-2*P)/n;
 var X=function(i){return P+bw*(i+.5)},Y=function(v){return H-P-(v-mn)/rg*(H-2*P)};
 var s='<svg viewBox="0 0 '+W+" "+H+'" role="img" aria-label="gráfico">';
 if(type=="l")s+='<polyline class="s" points="'+pts.map(function(p,i){return X(i).toFixed(1)+","+Y(p.v).toFixed(1)}).join(" ")+'"/>'+pts.map(function(p,i){return '<circle class="f" cx="'+X(i).toFixed(1)+'" cy="'+Y(p.v).toFixed(1)+'" r="3"/>'}).join("");
 else s+=pts.map(function(p,i){return '<rect class="'+(cls||"f")+'" x="'+(X(i)-bw*.35).toFixed(1)+'" y="'+Y(p.v).toFixed(1)+'" width="'+(bw*.7).toFixed(1)+'" height="'+Math.max(1,H-P-Y(p.v)).toFixed(1)+'" rx="2"/>'}).join("");
 var st=Math.ceil(n/6);s+=pts.map(function(p,i){return i%st==0?'<text x="'+X(i).toFixed(1)+'" y="'+(H-2)+'" text-anchor="middle">'+p.l+"</text>":""}).join("");
 return s+'</svg><div class="cm">máx. '+f1(mx)+(type=="l"?" · mín. "+f1(mn):"")+"</div>"}
var bar=function(p){return '<div class="bar"><i style="width:'+Math.max(0,Math.min(100,p))+'%"></i></div>'};
var tile=function(v,l){return '<div class="st"><b>'+v+"</b><small>"+l+"</small></div>"};
/* ---------- telas ---------- */
function vHome(){var g=S.g,n=dayN(),left=Math.max(0,g.dias-n+1),tp=Math.min(100,Math.round(n/g.dias*100)),t=today(),pt=pct(t),
 p7=pcts(lastDays(7)),ps=pesos(),pa=ps.length?ps[ps.length-1].v:g.peso0,dl=pa-g.peso0,
 res=sum(S.fin.filter(function(r){return r.k=="Reserva"}),function(r){return r.v}),rp=g.reserva>0?Math.round(res/g.reserva*100):0,
 ym=t.slice(0,7),fm=fin(ym+"-01",ym+"-31"),vend=sum(S.neg,function(r){return r.s}),
 tl=S.dis.filter(function(r){return r.t!==""}).sort(function(a,b){return b.d.localeCompare(a.d)}).slice(0,7).map(function(r){return r.t}),
 mp=g.pesoMeta>0&&g.peso0>g.pesoMeta?Math.round((g.peso0-pa)/(g.peso0-g.pesoMeta)*100):null,
 mets=S.met.filter(function(r){return r.a>0});
 var o='<div class="card hero"><small>Dia '+Math.min(n,g.dias)+" de "+g.dias+"</small><div style=\"font-size:34px;font-weight:700\">"+left+" dias restantes</div>"+bar(tp)+"<small>"+tp+"% do tempo do projeto</small></div>";
 o+='<div class="grid">'+tile(pt==null?"–":pt+"%","Checklist de hoje")+tile(p7.length?Math.round(avg(p7))+"%":"–","Média dos últimos 7 dias")+tile(f1(pa)+" kg",(dl>0?"+":"")+f1(dl)+" kg desde o início")+tile(mp==null?"–":Math.max(0,mp)+"%",mp==null?"Defina a meta de peso em Mais › Ajustes":"Rumo à meta de peso")+tile(fmt(fm.rec-fm.des),"Sobra do mês")+tile(rp+"%","Reserva: "+fmt(res)+" de "+fmt(g.reserva))+"</div>";
 o+='<div class="card"><h3>Negócio digital</h3><small>'+g.grupos+" grupo(s) no WhatsApp · "+(g.op?"operacional":"ainda não operacional")+"</small>"+bar(g.anual>0?vend/g.anual*100:0)+"<small>Vendas registradas "+fmt(vend)+" de "+fmt(g.anual)+" (meta anual)</small></div>";
 o+='<div class="card"><h3>Disciplina</h3><small>Redes sociais: início em '+esc(g.telaBase)+(tl.length?" · média recente "+f1(avg(tl))+" h/dia":" · sem registros ainda")+"</small></div>";
 if(mets.length)o+='<div class="card"><h3>Metas</h3>'+mets.slice(0,6).map(function(r){var p=Math.min(100,Math.round(r.c/r.a*100));return "<small>"+esc(r.p)+" · "+esc(r.n)+" ("+p+"%)</small>"+bar(p)}).join("")+"</div>";
 return o}
function vHoje(){var d=S.ui.d||today(),ts=dayTasks(d),c=S.chk[d]||[],p=pct(d),isT=d==today();
 var o='<div class="row" style="margin-bottom:10px"><button data-dd="-1" aria-label="Dia anterior" style="flex:0 0 56px">‹</button><input type="date" id="dt" value="'+d+'" style="margin:0"><button data-dd="1" aria-label="Próximo dia" style="flex:0 0 56px">›</button></div>';
 o+='<div class="card"><b>'+(isT?"Hoje":brd(d))+" · "+(p==null?0:p)+'% concluído</b>'+bar(p||0)+"<small>"+ts.filter(function(t){return c.indexOf(t.id)>=0}).length+" de "+ts.length+" tarefas</small></div>";
 o+=ts.map(function(t){var on=c.indexOf(t.id)>=0;return '<button class="tk'+(on?" on":"")+'" data-chk="'+t.id+'"><span>'+(on?"✅":"⬜")+"</span>"+esc(t.n)+"</button>"+noteHTML(t,d)}).join("")||'<p class="m">Nenhuma tarefa neste dia.</p>';
 o+='<details class="card"><summary><b>Gerenciar tarefas</b></summary><p class="m">Alterar ou arquivar tarefas não apaga o histórico dos dias anteriores.</p>'+S.tasks.filter(function(t){return !t.a}).map(function(t){return '<div class="it"><input data-tn="'+t.id+'" value="'+esc(t.n)+'" style="margin:0"><button data-ta="'+t.id+'" aria-label="Arquivar tarefa">📦</button></div>'}).join("")+'<form data-f="task" class="row" style="margin-top:10px"><input name="n" placeholder="Nova tarefa" style="margin:0"><button class="pri" style="flex:0 0 auto">Adicionar</button></form></details>'+notesHist();
 return o}
function vFin(){var t=today(),ym=t.slice(0,7),m=fin(ym+"-01",ym+"-31"),res=sum(S.fin.filter(function(r){return r.k=="Reserva"}),function(r){return r.v}),all=fin("0000","9999"),rp=S.g.reserva>0?Math.round(res/S.g.reserva*100):0;
 return '<div class="grid">'+tile(fmt(m.rec),"Receitas do mês")+tile(fmt(m.des),"Despesas do mês")+tile(fmt(m.rec-m.des),"Sobra do mês")+tile(fmt(m.par),"Parcelas do mês")+"</div>"+

function trnList(){var q=(S.ui.tq||"").toLowerCase(),rows=S.trn.slice().sort(function(a,b){return b.d.localeCompare(a.d)}).filter(function(r){return !q||(r.gm.join(" ")+" "+r.ex.map(function(e){return e.n}).join(" ")+" "+r.obs+" "+r.d+" "+brd(r.d)).toLowerCase().indexOf(q)>=0}).slice(0,40);
 return rows.length?rows.map(function(r){return '<div class="card"><div class="row" style="align-items:center;flex-wrap:nowrap"><div class="ib"><b>'+brd(r.d)+(r.gm.length?" · "+esc(r.gm.join(", ")):"")+"</b><small>"+(r.dur!==""&&r.dur!=null?f1(r.dur)+" min · ":"")+r.ex.length+' exercício(s)</small></div><button data-te="'+r.id+'" aria-label="Editar" style="flex:0 0 44px;padding:0">✎</button><button data-tx="'+r.id+'" aria-label="Excluir" style="flex:0 0 44px;padding:0">🗑</button></div>'+r.ex.map(function(e){return '<small style="display:block">• '+exStr(e)+"</small>"}).join("")+(r.obs?'<p class="m" style="margin:8px 0 0">'+esc(r.obs)+"</p>":"")+"</div>"}).join(""):'<p class="m">Nenhum treino encontrado.</p>'}
function vTrn(){if(!T)T=newT();var names={};S.trn.forEach(function(r){r.ex.forEach(function(e){if(e.n)names[e.n]=1})});
 var o='<div class="card"><h3>'+(T.id?"Editar treino":"Novo treino")+'</h3><label>Data<input type="date" data-t="d" value="'+esc(T.d)+'"></label><label>Grupos musculares</label><div class="row" style="margin-bottom:10px">'+GM.map(function(g){return '<button type="button" data-tg="'+g+'" class="'+(T.gm.indexOf(g)>=0?"pri":"")+'" style="flex:0 0 auto;min-height:44px">'+g+"</button>"}).join("")+"</div>";
 o+=T.ex.map(function(e,i){var p='data-t="ex.'+i+".";return '<div class="card" style="background:var(--bg)"><label>Exercício '+(i+1)+'<input list="exl" '+p+'n" value="'+esc(e.n)+'" placeholder="Ex.: Supino reto" autocomplete="off"></label><div class="row"><label>Séries<input inputmode="numeric" '+p+'s" value="'+esc(e.s)+'"></label><label>Repetições<input '+p+'r" value="'+esc(e.r)+'" placeholder="10 ou 12/10/8"></label><label>Carga (kg)<input inputmode="decimal" '+p+'c" value="'+esc(e.c)+'"></label></div><small id="lx'+i+'">'+esc(lastEx(e.n,T.d,T.id))+"</small>"+(T.ex.length>1?'<button type="button" data-tr="'+i+'" style="width:100%;margin-top:6px">Remover exercício</button>':"")+"</div>"}).join("");
 o+='<button type="button" data-ta2="1" style="width:100%;margin-bottom:12px">+ Adicionar exercício</button><label>Duração total (minutos)<input inputmode="numeric" data-t="dur" value="'+esc(T.dur)+'"></label><label>Observações (desempenho, dificuldades, evolução)<textarea class="big" data-t="obs">'+esc(T.obs)+'</textarea></label><div class="row"><button class="pri" data-tsave="1">Salvar treino</button>'+(T.id?'<button data-tcan="1">Cancelar</button>':"")+'</div><datalist id="exl">'+Object.keys(names).map(function(n){return '<option value="'+esc(n)+'">'}).join("")+"</datalist></div>";
 return o+'<div class="card"><h3>Treinos anteriores</h3><label>Buscar por grupo, exercício ou data<input data-tq="1" value="'+esc(S.ui.tq||"")+'" placeholder="Ex.: peito, supino, 20/11"></label></div><div id="tl">'+trnList()+"</div>"}
function saveT(){var ex=T.ex.map(function(e){return {n:String(e.n||"").trim(),s:String(e.s==null?"":e.s).trim(),r:String(e.r==null?"":e.r).trim(),c:String(e.c==null?"":e.c).trim()===""?"":num(e.c)}}).filter(function(e){return e.n||e.s||e.r||e.c!==""});
 if(!T.gm.length&&!ex.length){toast("Informe grupos musculares ou exercícios.");return}
 if(ex.some(function(e){return !e.n})){toast("Dê um nome a cada exercício.");return}
 var rec={id:T.id||uid(),d:T.d||today(),gm:T.gm.slice(),dur:String(T.dur==null?"":T.dur).trim()===""?"":num(T.dur),ex:ex,obs:String(T.obs||"").trim()},i=S.trn.findIndex(function(r){return r.id==T.id});
 if(T.id&&i>=0){var old=S.trn[i];rec.h=(old.h||[]).concat([Object.assign({at:today()},old,{h:undefined})]);S.trn[i]=rec}else S.trn.push(rec);
 T=null;save();toast("Treino salvo");render(1)}
function flush(){if(dirty){dirty=0;save()}}
document.addEventListener("input",function(ev){var t=ev.target,ds=t.dataset||{};
 if(ds.nt){var dd=S.ui.d||today(),n=S.notes[dd]||(S.notes[dd]={}),v=t.value;if(v.trim())n[ds.nt]=v;else{delete n[ds.nt];if(!Object.keys(n).length)delete S.notes[dd]}dirty=1;clearTimeout(ntm);ntm=setTimeout(flush,600)}
 if(ds.t&&T){var p=ds.t.split(".");if(p[0]=="ex"){T.ex[+p[1]][p[2]]=t.value;if(p[2]=="n"){var h=$("#lx"+p[1]);if(h)h.textContent=lastEx(t.value,T.d,T.id)}}else T[p[0]]=t.value}
 if(ds.tq!==undefined){S.ui.tq=t.value;var l=$("#tl");if(l)l.innerHTML=trnList()}});
window.addEventListener("pagehide",flush);
document.addEventListener("visibilitychange",function(){if(document.visibilityState=="hidden")flush()});
window.addEventListener("hashchange",function(){render()});
load();if(!ok)setTimeout(function(){toast("Armazenamento indisponível: use o backup com frequência.")},500);
render();setTimeout(doPull,800);
</script></body></html>
